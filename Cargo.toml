[package]
name = "kleio-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
kleio = { path = "../kleio" }
kleio-gedcom = { path = "../kleio-gedcom" }
serde_json = "1"
kleio-svg = { path = "../kleio-svg", features = ["png"] }

[[bin]]
name = "kleio-cli"
path = "src/main.rs"
